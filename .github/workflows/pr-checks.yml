# Runs on every pull request, so a broken change is caught before review
# rather than during it. The same checks a developer runs locally (see
# CONTRIBUTING.md), on a machine that has none of the local data:
#
#   - no Bachatt reference checkout -> the parity tests skip themselves
#   - no NAV store                  -> store-backed tests skip themselves
#
# What this does NOT run: the browser walks in check.sh (a11y, phone, console
# errors). They need a running server and a seeded account. Run them locally
# with `./check.sh` before asking for review.
name: pr-checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: compile every module
        run: python -m compileall -q app scripts
      - name: tests
        run: python -m pytest tests/ -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: types
        run: npx tsc -b --noEmit
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
