# The two nightly jobs, moved off the app process and onto GitHub's runners.
#
# Why this exists: the app used to need a host that never sleeps, purely so an
# in-process APScheduler could fire at 23:45 and 00:15 IST. Every free tier that
# never sleeps wants a credit card. Running the jobs here instead removes that
# requirement entirely, and public repositories get unlimited Actions minutes.
#
# ONE job, two steps, in order -- not two scheduled workflows.
#
# The split in app/services/screener/jobs exists because AMFI's file carries only
# each scheme's LATEST NAV, so a missed capture is recoverable only through
# mfapi's one-day-lagged mirror, while scoring can be re-run any time from NAVs
# already stored. That reasoning is about *failure*, not about timing. Two cron
# entries here would reintroduce a race GitHub makes worse than APScheduler did:
# scheduled workflows are queued, not guaranteed, and a delayed capture could
# start after the scoring run it feeds. Sequential steps cannot invert.
name: nightly

on:
  schedule:
    # 18:15 UTC = 23:45 IST, just after AMFI publishes around 23:00 IST.
    # GitHub queues scheduled workflows and may start them late; that only ever
    # delays the capture, it cannot reorder the steps below.
    - cron: "15 18 * * *"
  workflow_dispatch:

concurrency:
  # A late run must never overlap the next one: both would write the same store.
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write        # to publish the refreshed store as a release asset

jobs:
  refresh-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # The store is state, and state cannot live in git: it is rewritten every
      # night, so committing it would add ~24 MB to history daily. It lives as a
      # release asset instead -- replaceable, versionless, and outside the repo's
      # object store.
      - name: Fetch yesterday's NAV store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .navstore
          if gh release download nav-store --pattern 'nav.db.gz' --dir /tmp 2>/dev/null; then
            gunzip -c /tmp/nav.db.gz > .navstore/nav.db
            echo "restored $(du -h .navstore/nav.db | cut -f1)"
          else
            echo "::notice::no published store yet; this run will build one from scratch"
          fi

      # Step one. Capture today's NAVs from AMFI, then gap-fill from mfapi.
      - name: Refresh NAVs
        run: |
          python -c "
          from app.services.screener import navstore
          from app.jobs.scheduler import nav_refresh_job
          navstore.ensure_schema()
          nav_refresh_job()
          "

      # Step two, and it only starts because step one returned. This ordering is
      # the whole reason the two are in one job.
      - name: Score the universe
        run: |
          python -c "
          from app.services.screener.pipeline import nightly_job
          nightly_job()
          "

      - name: Trim to the buyable universe
        run: |
          python scripts/trim_nav_store.py --out .navstore/nav.publish.db --gzip
          mv .navstore/nav.publish.db.gz nav.db.gz

      # Fail loudly rather than publishing a store that would serve an empty
      # screen. A ranking is only meaningful if the run behind it completed.
      - name: Refuse to publish an empty ranking
        run: |
          python -c "
          import sqlite3, sys
          c = sqlite3.connect('.navstore/nav.publish.db')
          n = c.execute('SELECT count(*) FROM screener_score WHERE run_id=(SELECT max(id) FROM screener_run)').fetchone()[0]
          print(f'{n} funds ranked in the published run')
          sys.exit(0 if n >= 1000 else f'only {n} funds ranked; refusing to publish')
          "

      - name: Publish the store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nav-store >/dev/null 2>&1 || \
            gh release create nav-store --title "NAV store" \
              --notes "Rebuilt nightly by .github/workflows/nightly.yml. Not a code release."
          gh release upload nav-store nav.db.gz --clobber
